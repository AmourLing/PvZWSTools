name: Sync to Gitee

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  GIT_TERMINAL_PROMPT: 0
  GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify GITEE_TOKEN
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN secret 未配置，请到 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
          echo "GITEE_TOKEN 已配置（长度 ${#GITEE_TOKEN}）"

      - name: Show GitHub repo size
        run: |
          echo "=== GitHub 仓库当前大小 ==="
          curl -s -H "User-Agent: pvz-sync" https://api.github.com/repos/AmourLing/PvZWSTools | grep -E '"size"|"pushed_at"'

      - name: Clone GitHub mirror
        timeout-minutes: 3
        run: |
          set -e
          echo "开始 clone..."
          # --progress 让 CI 输出实时进度，避免静默卡住
          git clone --mirror --progress https://github.com/AmourLing/PvZWSTools.git pvz-mirror 2>&1
          echo "clone 完成"
          du -sh pvz-mirror
          ls -la pvz-mirror/

      - name: Push to Gitee
        timeout-minutes: 5
        run: |
          set -e
          cd pvz-mirror
          # 注意 Gitee 用户名是 AmourLing0412（GitHub 上仍为 AmourLing）
          git remote set-url --push origin "https://AmourLing0412:${GITEE_TOKEN}@gitee.com/AmourLing0412/PvZWSTools.git"
          echo "开始 push 到 Gitee..."
          # --mirror 推送所有 refs（branches + tags + notes），隐含 --force
          git push --mirror --progress 2>&1
          echo "push 完成"
